[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
]

[project.scripts]
cortex = "chatbot.core:run_chatbot"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernise syntax for Python 3.9+)
    "B",   # flake8-bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]